name: API Compatibility

# 用 gorelease 对照上一个 tag 检测导出 API，并验证明确的候选版本满足 SemVer。
# v0.x 允许在 minor 版本中包含有意破坏，但工具、网络、加载和版本验证失败都必须阻断。
on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: api-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 确保 API 门禁使用 setup-go 选定的工具链，不允许静默自动升级。
  GOTOOLCHAIN: local
  API_BASE_VERSION: "v0.2.6"
  API_RELEASE_VERSION: "v0.3.0"
  API_BREAKING_BASELINE: ".github/workflows/api-breaking-v0.3.0.txt"
  API_BREAKING_CHECKER: ".github/workflows/check-api-breaking.py"

jobs:
  gorelease:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checkout credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(http\..*\.extraheader|credential\..*|core\.askpass|url\..*\.insteadof)$'
          for scope in --local --global; do
            if git config "$scope" --name-only --get-regexp "$pattern"; then
              echo "Git credential configuration must be absent before repository code runs: $scope" >&2
              exit 1
            fi
          done
          for name in GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS GIT_SSH GIT_SSH_COMMAND GIT_CONFIG_COUNT; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "Credential environment must be absent before repository code runs: $name" >&2
              exit 1
            fi
          done
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.12'
          check-latest: false
      - name: Install gorelease
        run: go install golang.org/x/exp/cmd/gorelease@v0.0.0-20260727155853-b88d891fe743
      - name: Verify release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "$API_RELEASE_VERSION" ]]; then
            echo "Release tag must match the approved API release version: expected '$API_RELEASE_VERSION', got '$GITHUB_REF_NAME'." >&2
            exit 1
          fi
      - name: Check API compatibility
        shell: bash
        run: |
          set -euo pipefail
          report_path="$RUNNER_TEMP/gorelease-report.txt"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # tag 触发时目标版本已存在，gorelease 的 -version 会报 "already exists"；
            # 只做 base 对比输出 breaking 报告，版本号一致性由 Verify release tag 保证。
            gorelease -base="$API_BASE_VERSION" | tee "$report_path"
          else
            gorelease -base="$API_BASE_VERSION" -version="$API_RELEASE_VERSION" | tee "$report_path"
          fi
          python3 "$API_BREAKING_CHECKER" "$report_path" "$API_BREAKING_BASELINE"
