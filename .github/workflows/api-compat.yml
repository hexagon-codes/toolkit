name: API Compatibility

# 用 gorelease 对照上一个 tag 检测导出 API，并验证明确的候选版本满足 SemVer。
# v0.x 允许在 minor 版本中包含有意破坏，但工具、网络、加载和版本验证失败都必须阻断。
on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: api-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 确保 API 门禁使用 setup-go 选定的工具链，不允许静默自动升级。
  GOTOOLCHAIN: local
  API_BREAKING_BASELINE: ".github/workflows/api-breaking-v0.3.0.txt"
  API_BREAKING_CHECKER: ".github/workflows/check-api-breaking.py"

jobs:
  gorelease:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checkout credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(http\..*\.extraheader|credential\..*|core\.askpass|url\..*\.insteadof)$'
          for scope in --local --global; do
            if git config "$scope" --name-only --get-regexp "$pattern"; then
              echo "Git credential configuration must be absent before repository code runs: $scope" >&2
              exit 1
            fi
          done
          for name in GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS GIT_SSH GIT_SSH_COMMAND GIT_CONFIG_COUNT; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "Credential environment must be absent before repository code runs: $name" >&2
              exit 1
            fi
          done
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.12'
          check-latest: false
      - name: Install gorelease
        run: go install golang.org/x/exp/cmd/gorelease@v0.0.0-20260727155853-b88d891fe743
      - name: Verify release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          # 只校验 tag 名是合法 SemVer；具体版本的发布审批由发布流程（人）完成，
          # 门禁不再绑定固定版本号，避免每次发版都要先改 workflow。
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a semantic version: got '$GITHUB_REF_NAME'." >&2
            exit 1
          fi
      - name: Check API compatibility
        shell: bash
        run: |
          set -euo pipefail
          report_path="$RUNNER_TEMP/gorelease-report.txt"
          # 统一以最新的已发布 tag 为 base 做 API 对比（tag 触发时排除自身，
          # PR 触发时不含目标版本 tag，自然得到最新发布版本）。gorelease 不带
          # -version：目标版本已存在时报 already exists、base 非 major 最新时
          # 报 Cannot suggest，两种受限模式都不适用于发布门禁。
          base_version="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$GITHUB_REF_NAME" | head -1)"
          gorelease -base="$base_version" | tee "$report_path"
          python3 "$API_BREAKING_CHECKER" "$report_path" "$API_BREAKING_BASELINE" --allow-empty
