name: API Compatibility

# 发布前对照最新稳定 tag 检测导出 API，发布入口结合变更分类核对候选版本。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Unpublished candidate version for explicit API validation"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: api-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 确保 API 门禁使用 setup-go 选定的工具链，不允许静默自动升级。
  GOTOOLCHAIN: local
  GOWORK: "off"
  GORELEASE_VERSION: v0.0.0-20260727155853-b88d891fe743
  API_BREAKING_BASELINE: ".github/workflows/api-breaking-v0.3.0.txt"
  API_BREAKING_CHECKER: ".github/workflows/check-api-breaking.py"

jobs:
  gorelease:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checkout credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(http\..*\.extraheader|credential\..*|core\.askpass|url\..*\.insteadof)$'
          for scope in --local --global; do
            if git config "$scope" --name-only --get-regexp "$pattern"; then
              echo "Git credential configuration must be absent before repository code runs: $scope" >&2
              exit 1
            fi
          done
          for name in GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS GIT_SSH GIT_SSH_COMMAND GIT_CONFIG_COUNT; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "Credential environment must be absent before repository code runs: $name" >&2
              exit 1
            fi
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Install gorelease
        run: go install golang.org/x/exp/cmd/gorelease@${{ env.GORELEASE_VERSION }}
      - name: Check API compatibility
        shell: bash
        env:
          REQUESTED_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          report_path="$RUNNER_TEMP/gorelease-report.txt"
          # 版本建议只用于发布前；tag 发布后的模块核验不再次运行 gorelease。
          base_version="$(git tag --sort=v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | tail -1)"
          if [[ ! "$base_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "A stable API comparison base is required." >&2
            exit 1
          fi
          export API_BASE_TAG="$base_version"
          API_BASE_SHA="$(git rev-parse "$base_version^{commit}")"
          export API_BASE_SHA
          module_path="$(awk '$1 == "module" {print $2; exit}' go.mod)"
          module_path="${module_path//\"/}"
          module_major=""
          if [[ "$module_path" =~ /v([0-9]+)$ ]]; then
            module_major="${BASH_REMATCH[1]}"
            if [[ ! "$module_major" =~ ^[1-9][0-9]*$ || "$module_major" == 1 ]]; then
              echo "Module major version suffix must be v2 or higher." >&2
              exit 1
            fi
          fi
          base_major="${base_version#v}"
          base_major="${base_major%%.*}"
          release_version="${REQUESTED_RELEASE_VERSION:-}"
          # 跨模块主版本无法推导版本建议，自动比较先核验该主版本的首个稳定版本。
          if [[ -z "$release_version" && -n "$module_major" && "$module_major" != "$base_major" ]]; then
            release_version="v${module_major}.0.0"
          fi
          release_args=()
          if [[ -n "$release_version" ]]; then
            if [[ ! "$release_version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "A stable candidate version is required." >&2
              exit 1
            fi
            release_major="${release_version#v}"
            release_major="${release_major%%.*}"
            if [[ -n "$module_major" && "$release_major" != "$module_major" ]] ||
              [[ -z "$module_major" && "$release_major" != 0 && "$release_major" != 1 ]]; then
              echo "Candidate version does not match the module major version." >&2
              exit 1
            fi
            release_args+=("-version=$release_version")
          fi
          export API_RELEASE_VERSION="$release_version"
          export API_CHANGES_FILE="$RUNNER_TEMP/api-changes.json"
          gorelease -base="$base_version" "${release_args[@]}" | tee "$report_path"
          python3 "$API_BREAKING_CHECKER" "$report_path" "$API_BREAKING_BASELINE" --allow-empty --json-output "$API_CHANGES_FILE"
          python3 scripts/verification-inputs.py "$RUNNER_TEMP/api-inputs.json"
      - name: Preserve verification inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-inputs-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/api-inputs.json
            ${{ runner.temp }}/api-changes.json
            ${{ runner.temp }}/gorelease-report.txt
          retention-days: 90
