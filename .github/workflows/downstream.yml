name: Downstream Contract

# 接缝契约门禁：toolkit（L0）任何改动，必须覆盖全部已知消费者及嵌套模块。
# 下游使用 go.mod 声明的最低工具链，禁止静默切换到其他版本。
on:
  push:
    branches: [main]
    # 纯文档改动跳过；tag 触发不受 paths 过滤影响，发布门禁保持全量。
    paths-ignore:
      - "**/*.md"
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downstream-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 确保下游契约门禁使用 setup-go 选定的工具链，不允许静默自动升级。
  GOTOOLCHAIN: local
  GOPRIVATE: github.com/hexagon-codes/*

jobs:
  downstream:
    name: ai-core + hexagon + examples + hexclaw
    # 编译契约与原生接缝验证使用同一 Linux 工具链环境。
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: toolkit
          persist-credentials: false
      - name: Read consumer baselines
        id: consumers
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, os
          with open('toolkit/.github/consumer-baselines.json') as source:
              refs = json.load(source)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, sha in refs.items():
                  output.write(name.replace('-', '_') + '=' + sha + '\n')
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hexagon-codes/ai-core
          ref: ${{ steps.consumers.outputs.ai_core }}
          path: ai-core
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hexagon-codes/hexagon
          ref: ${{ steps.consumers.outputs.hexagon }}
          path: hexagon
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hexagon-codes/hexclaw
          ref: ${{ steps.consumers.outputs.hexclaw }}
          path: hexclaw
          persist-credentials: false
      - name: Verify checkout credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(http\..*\.extraheader|credential\..*|core\.askpass|url\..*\.insteadof)$'
          if git config --global --name-only --get-regexp "$pattern"; then
            echo "Global Git credential configuration must be absent before repository code runs." >&2
            exit 1
          fi
          for repository in toolkit ai-core hexagon hexclaw; do
            if git -C "$repository" config --local --name-only --get-regexp "$pattern"; then
              echo "Git credential configuration must be absent before repository code runs: $repository" >&2
              exit 1
            fi
          done
          for name in GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS GIT_SSH GIT_SSH_COMMAND GIT_CONFIG_COUNT; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "Credential environment must be absent before repository code runs: $name" >&2
              exit 1
            fi
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: toolkit/go.mod
          check-latest: false
          cache: false
      - name: go.work（下游用本 PR 的 toolkit）
        run: go work init ./toolkit ./ai-core ./hexagon ./hexagon/examples ./hexclaw
      # 下游契约 = 编译契约：build 证明 API 未破坏下游；全量测试由各下游
      # 仓库自己的 CI 负责（职责归位，避免 toolkit 门禁耦合下游全量回归）。
      - name: ai-core build + compile tests
        working-directory: ai-core
        run: go build -mod=readonly ./... && go test -mod=readonly -run '^$' -count=1 ./...
      - name: hexagon build + compile tests
        working-directory: hexagon
        run: go build -mod=readonly ./... && go test -mod=readonly -run '^$' -count=1 ./...
      - name: hexagon examples build + compile tests
        working-directory: hexagon/examples
        run: go build -mod=readonly ./... && go test -mod=readonly -run '^$' -count=1 ./...
      - name: hexclaw build + compile tests
        working-directory: hexclaw
        run: go build -mod=readonly ./... && go test -mod=readonly -run '^$' -count=1 ./...
      - name: Record verification inputs
        working-directory: toolkit
        shell: bash
        run: python scripts/verification-inputs.py "$RUNNER_TEMP/verification-inputs.json" --consumers
      - name: Preserve verification inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-inputs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification-inputs.json
          retention-days: 90
