name: Downstream Contract

# 接缝契约门禁：toolkit（L0）任何改动，必须让全部消费者（ai-core / hexagon / hexclaw）
# 在 go.work 下 build+test 仍全绿。底座层影响面最广，门禁最严。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  downstream:
    name: ai-core + hexagon + hexclaw against this toolkit
    # hexclaw exercises toolkit/os/sandbox for real code_exec coverage. Keep this
    # aligned with sandbox-code-exec.yml's Linux runner where bubblewrap works.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { path: toolkit }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { repository: hexagon-codes/ai-core, path: ai-core }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { repository: hexagon-codes/hexagon, path: hexagon }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { repository: hexagon-codes/hexclaw, path: hexclaw }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version: '1.25.x' }  # 浮动 1.25 最新补丁(见 ci.yml vuln job 注释)
      - name: Install Linux sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap util-linux
      - name: go.work（下游用本 PR 的 toolkit）
        run: go work init ./toolkit ./ai-core ./hexagon ./hexclaw
      - name: ai-core build + test
        run: (cd ai-core && go build ./... && go test ./...)
      - name: hexagon build + test
        run: (cd hexagon && go build ./... && go test ./...)
      - name: hexclaw build + test
        run: (cd hexclaw && go build ./... && go test ./...)
