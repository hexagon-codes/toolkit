name: CI

on:
  push:
    branches: [main]
    # 纯文档改动（*.md）不影响代码与门禁语义，跳过全量 CI，避免文档迭代
    # 触发偶发测试误伤；tag 触发不受 paths 过滤影响，发布门禁保持全量。
    paths-ignore:
      - "**/*.md"
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 禁止 go 命令绕过矩阵静默下载其他工具链，确保每个门禁验证的就是声明版本。
  GOTOOLCHAIN: local

jobs:
  workflow-lint:
    name: CI workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify checkout credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(http\..*\.extraheader|credential\..*|core\.askpass|url\..*\.insteadof)$'
          for scope in --local --global; do
            if git config "$scope" --name-only --get-regexp "$pattern"; then
              echo "Git credential configuration must be absent before repository code runs: $scope" >&2
              exit 1
            fi
          done
          for name in GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS GIT_SSH GIT_SSH_COMMAND GIT_CONFIG_COUNT; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "Credential environment must be absent before repository code runs: $name" >&2
              exit 1
            fi
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Record verification inputs
        run: python3 scripts/verification-inputs.py "$RUNNER_TEMP/verification-inputs.json"
      - name: Preserve verification inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-inputs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification-inputs.json
          retention-days: 90

  test:
    name: Native minimum (${{ matrix.name }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04 托管运行器目前禁用了 bubblewrap/unshare 所需的命名空间能力，
          # Linux 沙箱测试固定在已验证可用的镜像上。
          - name: Linux
            os: ubuntu-22.04
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify checkout credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(http\..*\.extraheader|credential\..*|core\.askpass|url\..*\.insteadof)$'
          for scope in --local --global; do
            if git config "$scope" --name-only --get-regexp "$pattern"; then
              echo "Git credential configuration must be absent before repository code runs: $scope" >&2
              exit 1
            fi
          done
          for name in GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS GIT_SSH GIT_SSH_COMMAND GIT_CONFIG_COUNT; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "Credential environment must be absent before repository code runs: $name" >&2
              exit 1
            fi
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # 最低工具链以 go.mod 为唯一来源，补丁升级无需逐个修改工作流。
          go-version-file: go.mod
          check-latest: false
      - name: Normalize checkout line endings (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Windows runner 全局 autocrlf=true 会把文本文件检出为 CRLF，导致 gofmt/tidy/
          # 合同测试假失败。关闭 local autocrlf 后由 git 原生重写全部工作树文件为 LF
          # （checkout-index 不经 MSYS2 文本转换，二进制判定交给 git 自身）。
          git config core.autocrlf false
          git checkout-index -f -u -a
          # 重写工作树后刷新索引 stat 缓存，避免 git status 按旧 stat 误报 M。
          git update-index --refresh >/dev/null 2>&1 || true
      - name: Install Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: ./scripts/install-bubblewrap-ci.sh
      - name: Setup Node.js (macOS)
        if: runner.os == 'macOS'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Setup Python (macOS)
        if: runner.os == 'macOS'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Verify root module metadata
        run: go mod tidy -diff
      - run: go mod download
      - name: Build
        run: go build -mod=readonly ./...
      - name: Vet
        run: go vet -mod=readonly ./...
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          go test -json -mod=readonly -count=1 ./... | tee "$RUNNER_TEMP/ordinary-tests.jsonl"
      - name: Verify native macOS sandbox security
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(go env GOOS)" != "darwin" ]]; then
            echo "Expected a native macOS runner." >&2
            exit 1
          fi
          expected_go="go$(awk '$1 == "go" {print $2; exit}' go.mod)"
          if [[ "$(go env GOVERSION)" != "$expected_go" ]]; then
            echo "Expected $expected_go for the minimum-version gate." >&2
            exit 1
          fi

          required_tests=(
            TestDarwinNoChildProfileOmitsProcessForkGrant
            TestDarwinNoChildCapabilitiesAreEnforced
            TestDarwinNoChildBoundaryAllowsDirectSingleProcessRuntimes
            TestDarwinNoChildBoundaryBlocksNativeForkVariants
            TestDarwinNoChildBoundaryBlocksLanguageRuntimeSpawns
            TestDarwinNoChildBoundaryAllowsNodeWorkerThreads
            TestDarwinNoChildBoundaryTimeoutAndCancelKillTrackedRoot
            TestDarwinNoChildBoundaryBlocksDelayedSetsidMarkerForOneHundredRuns
            TestDarwinNoChildEnvironmentLauncherStartsInsideSeatbelt
            TestDarwinResourceLauncherDoesNotLoadCallerInitWithPayloadEnvironment
            TestDarwinExecutionGuardRejectsWorkspaceHardlinkBeforePayload
            TestDarwinExecutionGuardRejectsWorkspacePathAndDirectoryReplacement
            TestDarwinTrustedBuildProfileAllowsChildrenWithoutClaimingContainment
            TestDarwinTrustedBuildRunsFrozenGoCompilerChild
            TestDarwinRejectsProcessCreationAndContainmentBeforePayload
          )
          python3 scripts/verify-go-test-events.py "$RUNNER_TEMP/ordinary-tests.jsonl" \
            github.com/hexagon-codes/toolkit/os/sandbox "${required_tests[@]}"
      - name: Test (race + coverage)
        if: runner.os != 'Windows'
        run: go test -mod=readonly -race -count=1 -coverprofile=coverage.out ./...
      - name: Test Windows (race)
        if: runner.os == 'Windows'
        run: go test -mod=readonly -race -count=1 ./...
      - name: Verify repository remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          # Windows 上工作树 LF 会被 git status 误报为 M（平台表示差异，内容已由
          # git diff 权威校验）；只检查真实变更（untracked/新增/删除）。
          if git status --porcelain --untracked-files=normal | grep -qv '^ M '; then
            echo "Go verification generated untracked repository files." >&2
            git status --short
            exit 1
          fi
      - name: Preserve diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.job }}-${{ runner.os }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/*.jsonl
            ${{ runner.temp }}/*probe.log
            ${{ runner.temp }}/toolkit-integration-*
          retention-days: 7

  windows-sandbox-security:
    name: Native Windows sandbox security
    if: github.event_name != 'schedule'
    # GitHub 托管的 windows-2022 每个任务使用全新管理员 VM；策略仅存在于该任务生命周期内。
    # 运行时仍须证明 AppLocker 模块、AppIDSvc 和本地强制策略均真实可用，禁止按镜像标签推断能力。
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify hosted runner and checkout credentials
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          if ($env:RUNNER_ENVIRONMENT -ne "github-hosted") {
            throw "The Windows security gate must run on a GitHub-hosted runner."
          }
          if ($env:RUNNER_OS -ne "Windows" -or $env:RUNNER_ARCH -ne "X64") {
            throw "The Windows security gate requires a native Windows x64 runner."
          }
          $operatingSystem = Get-CimInstance -ClassName Win32_OperatingSystem -ErrorAction Stop
          if ($operatingSystem.Caption -notmatch "Windows Server 2022") {
            throw "The Windows security gate requires Windows Server 2022: $($operatingSystem.Caption)"
          }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw "The GitHub-hosted Windows security runner must use an administrator account."
          }
          $credentialPattern = '^(http\..*\.extraheader|credential\..*|core\.askpass|url\..*\.insteadof)$'
          foreach ($scope in @("--local", "--global")) {
            $credentialKeys = @(git config $scope --name-only --get-regexp $credentialPattern 2>$null)
            $gitConfigExitCode = $LASTEXITCODE
            if ($gitConfigExitCode -ne 0 -and $gitConfigExitCode -ne 1) {
              throw "Git credential configuration query failed for scope ${scope}: exit code $gitConfigExitCode"
            }
            if ($credentialKeys.Count -ne 0) {
              throw "Git credential configuration must be absent before repository code runs: $scope"
            }
          }
          foreach ($name in @("GH_TOKEN", "GITHUB_TOKEN", "GIT_ASKPASS", "SSH_ASKPASS", "GIT_SSH", "GIT_SSH_COMMAND", "GIT_CONFIG_COUNT")) {
            if (Test-Path "Env:$name") {
              throw "Credential environment must be absent before repository code runs: $name"
            }
          }
          $global:LASTEXITCODE = 0
      - name: Normalize checkout line endings (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Windows runner 全局 autocrlf=true 会把文本文件检出为 CRLF，导致 gofmt/tidy/
          # 合同测试假失败。关闭 local autocrlf 后由 git 原生重写全部工作树文件为 LF
          # （checkout-index 不经 MSYS2 文本转换，二进制判定交给 git 自身）。
          git config core.autocrlf false
          git checkout-index -f -u -a
          # 重写工作树后刷新索引 stat 缓存，避免 git status 按旧 stat 误报 M。
          git update-index --refresh >/dev/null 2>&1 || true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Build and vet native Windows sandbox
        shell: pwsh
        run: |
          go mod download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -tags windows_security ./os/sandbox
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native Windows sandbox security
        shell: pwsh
        run: |
          $requiredTests = @(
            "TestWindows_SandboxCreation"
            "TestWindows_ExecSimpleCommand"
            "TestWindows_WorkspaceIsolation"
            "TestWindows_HostPathEscapeDenied"
            "TestWindowsWorkspaceRejectsRootJunction"
            "TestWindowsWorkspaceRootGuardRejectsJunction"
            "TestWindowsWorkspaceRejectsExternalHardLink"
            "TestWindowsWorkspaceRejectsReparsePoint"
            "TestWindowsWorkspaceRejectsInternalReparsePoint"
            "TestWindowsNetworkPolicyMatrix"
            "TestWindowsNetworkHostRejectedBeforeExecution"
            "TestWindows_NetworkDisabledSocketMatrix"
            "TestWindows_Timeout"
            "TestWindows_TimeoutTerminatesProcessContainment"
            "TestWindows_ContextCanceledTerminatesProcessContainment"
            "TestWindows_JobTotalMemoryEnforced"
            "TestWindows_JobProcessLimitEnforced"
            "TestWindows_ExecPreservesNonZeroExitCode"
            "TestWindowsLaunchFailureTransfersOwnershipToQuarantine"
            "TestWindowsProcessQuarantineRetriesBoundedlyAndPreservesErrors"
            "TestWindowsProcessQuarantineRetainsUnconfirmedResources"
            "TestWindowsSandboxCloseRetriesAndReclaimsQuarantinedLaunch"
            "TestWindowsSandboxCloseKeepsWorkspaceProtectedUntilRetriedReclaim"
            "TestWindowsNativePostCreationFaultOwnership"
            "TestWindowsNativePostCreationFaultCloseRetriesQuarantine"
            "TestWindowsNativeRetainExecutionOwnership"
          )
          $pattern = "^(" + ($requiredTests -join "|") + ")$"
          $listedTests = @(go test -tags windows_security ./os/sandbox -list $pattern)
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          foreach ($test in $requiredTests) {
            if ($listedTests -notcontains $test) {
              throw "Required native Windows sandbox test is missing: $test"
            }
          }

          $events = @(go test -race -tags windows_security -json -count=1 -timeout 300s ./os/sandbox -run $pattern)
          $testExitCode = $LASTEXITCODE
          $events | ForEach-Object { Write-Output $_ }
          if ($testExitCode -ne 0) {
            exit $testExitCode
          }
          $parsedEvents = @($events | ForEach-Object {
            if (-not [string]::IsNullOrWhiteSpace($_)) {
              $_ | ConvertFrom-Json -ErrorAction Stop
            }
          })
          foreach ($requiredTest in $requiredTests) {
            $passEvents = @($parsedEvents | Where-Object { $_.Action -eq "pass" -and $_.Test -eq $requiredTest })
            if ($passEvents.Count -ne 1) {
              throw "Required native Windows sandbox test did not produce exactly one pass event: $requiredTest"
            }
            $skipEvents = @($parsedEvents | Where-Object {
              $_.Action -eq "skip" -and ($_.Test -eq $requiredTest -or $_.Test.StartsWith("$requiredTest/"))
            })
            if ($skipEvents.Count -ne 0) {
              throw "Required native Windows sandbox test was skipped: $requiredTest"
            }
          }
      - name: Preserve diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.job }}-${{ runner.os }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/*.jsonl
            ${{ runner.temp }}/*probe.log
            ${{ runner.temp }}/toolkit-integration-*
          retention-days: 7

  linux-root-sandbox-security:
    name: Native root Linux sandbox security
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify checkout credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(http\..*\.extraheader|credential\..*|core\.askpass|url\..*\.insteadof)$'
          for scope in --local --global; do
            if git config "$scope" --name-only --get-regexp "$pattern"; then
              echo "Git credential configuration must be absent before repository code runs: $scope" >&2
              exit 1
            fi
          done
          for name in GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS GIT_SSH GIT_SSH_COMMAND GIT_CONFIG_COUNT; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "Credential environment must be absent before repository code runs: $name" >&2
              exit 1
            fi
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install native Linux sandbox dependencies
        run: ./scripts/install-bubblewrap-ci.sh
      - name: Verify native root and non-root Linux sandbox
        shell: bash
        run: bash scripts/verify-linux-sandbox-ci.sh
      - name: Preserve diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.job }}-${{ runner.os }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/*.jsonl
            ${{ runner.temp }}/*probe.log
            ${{ runner.temp }}/toolkit-integration-*
          retention-days: 7

  toolchain-compatibility:
    name: Toolchain compatibility (${{ matrix.name }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1.26.x 强制解析该版本线的最新补丁；stable 是有意不可复现的前向兼容性探针。
          - name: Go 1.26 current
            go-version: '1.26.x'
            check-latest: true
          - name: Latest stable Go
            go-version: 'stable'
            check-latest: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify checkout credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(http\..*\.extraheader|credential\..*|core\.askpass|url\..*\.insteadof)$'
          for scope in --local --global; do
            if git config "$scope" --name-only --get-regexp "$pattern"; then
              echo "Git credential configuration must be absent before repository code runs: $scope" >&2
              exit 1
            fi
          done
          for name in GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS GIT_SSH GIT_SSH_COMMAND GIT_CONFIG_COUNT; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "Credential environment must be absent before repository code runs: $name" >&2
              exit 1
            fi
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: ${{ matrix.check-latest }}
      - name: Verify selected toolchain
        run: |
          go version
          go env GOTOOLCHAIN
      - name: Install Linux sandbox dependencies
        run: ./scripts/install-bubblewrap-ci.sh
      - run: go mod download
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...

  examples:
    name: Examples
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify checkout credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(http\..*\.extraheader|credential\..*|core\.askpass|url\..*\.insteadof)$'
          for scope in --local --global; do
            if git config "$scope" --name-only --get-regexp "$pattern"; then
              echo "Git credential configuration must be absent before repository code runs: $scope" >&2
              exit 1
            fi
          done
          for name in GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS GIT_SSH GIT_SSH_COMMAND GIT_CONFIG_COUNT; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "Credential environment must be absent before repository code runs: $name" >&2
              exit 1
            fi
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Normalize checkout line endings (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Windows runner 全局 autocrlf=true 会把文本文件检出为 CRLF，导致 gofmt/tidy/
          # 合同测试假失败。关闭 local autocrlf 后由 git 原生重写全部工作树文件为 LF
          # （checkout-index 不经 MSYS2 文本转换，二进制判定交给 git 自身）。
          git config core.autocrlf false
          git checkout-index -f -u -a
          # 重写工作树后刷新索引 stat 缓存，避免 git status 按旧 stat 误报 M。
          git update-index --refresh >/dev/null 2>&1 || true
      - name: Verify examples module metadata
        shell: bash
        working-directory: examples
        run: GOWORK=off go mod tidy -diff
      - name: Verify examples module
        shell: bash
        run: ./scripts/verify-examples.sh
      - name: Verify repository remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          # Windows 上工作树 LF 会被 git status 误报为 M（平台表示差异，内容已由
          # git diff 权威校验）；只检查真实变更（untracked/新增/删除）。
          if git status --porcelain --untracked-files=normal | grep -qv '^ M '; then
            echo "Example verification generated untracked repository files." >&2
            git status --short
            exit 1
          fi

  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # only-new-issues 需完整历史以计算与基线的差异
          persist-credentials: false
      - name: Verify checkout credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(http\..*\.extraheader|credential\..*|core\.askpass|url\..*\.insteadof)$'
          for scope in --local --global; do
            if git config "$scope" --name-only --get-regexp "$pattern"; then
              echo "Git credential configuration must be absent before repository code runs: $scope" >&2
              exit 1
            fi
          done
          for name in GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS GIT_SSH GIT_SSH_COMMAND GIT_CONFIG_COUNT; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "Credential environment must be absent before repository code runs: $name" >&2
              exit 1
            fi
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Normalize checkout line endings (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Windows runner 全局 autocrlf=true 会把文本文件检出为 CRLF，导致 gofmt/tidy/
          # 合同测试假失败。关闭 local autocrlf 后由 git 原生重写全部工作树文件为 LF
          # （checkout-index 不经 MSYS2 文本转换，二进制判定交给 git 自身）。
          git config core.autocrlf false
          git checkout-index -f -u -a
          # 重写工作树后刷新索引 stat 缓存，避免 git status 按旧 stat 误报 M。
          git update-index --refresh >/dev/null 2>&1 || true
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.12.2          # 固定版本保证可复现; v8 action 支持 golangci-lint v2 (.golangci.yml 为 version "2")
          args: --timeout=5m

  integration:
    name: Integration (MySQL + Redis)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify checkout credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(http\..*\.extraheader|credential\..*|core\.askpass|url\..*\.insteadof)$'
          for scope in --local --global; do
            if git config "$scope" --name-only --get-regexp "$pattern"; then
              echo "Git credential configuration must be absent before repository code runs: $scope" >&2
              exit 1
            fi
          done
          for name in GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS GIT_SSH GIT_SSH_COMMAND GIT_CONFIG_COUNT; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "Credential environment must be absent before repository code runs: $name" >&2
              exit 1
            fi
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Run isolated integration tests
        run: ./scripts/verify-integrations.sh
      - name: Preserve diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.job }}-${{ runner.os }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/*.jsonl
            ${{ runner.temp }}/*probe.log
            ${{ runner.temp }}/toolkit-integration-*
          retention-days: 7

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify checkout credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(http\..*\.extraheader|credential\..*|core\.askpass|url\..*\.insteadof)$'
          for scope in --local --global; do
            if git config "$scope" --name-only --get-regexp "$pattern"; then
              echo "Git credential configuration must be absent before repository code runs: $scope" >&2
              exit 1
            fi
          done
          for name in GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS GIT_SSH GIT_SSH_COMMAND GIT_CONFIG_COUNT; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "Credential environment must be absent before repository code runs: $name" >&2
              exit 1
            fi
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # 使用最低支持版本扫描；标准库漏洞必须通过显式提升基线修复，不能被浮动工具链掩盖。
          go-version-file: go.mod
          check-latest: false
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          # 工具异常、分析失败和真实漏洞均保持非零退出，禁止宽泛豁免制造假绿。
          govulncheck ./...

  ci-result:
    name: CI result
    if: always()
    needs: [workflow-lint, test, windows-sandbox-security, linux-root-sandbox-security, toolchain-compatibility, examples, lint, integration, vuln]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs completed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          failed = {name: value['result'] for name, value in json.loads(os.environ['RESULTS']).items() if value['result'] != 'success'}
          if failed:
              raise SystemExit('Required CI jobs did not pass: ' + json.dumps(failed))
          PYCODE
