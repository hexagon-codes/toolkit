          - name: Go 1.25 current
            go-version: '1.25.x'
            check-latest: true
          - name: Latest stable Go
            go-version: 'stable'
            check-latest: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify checkout credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(http\..*\.extraheader|credential\..*|core\.askpass|url\..*\.insteadof)$'
          for scope in --local --global; do
            if git config "$scope" --name-only --get-regexp "$pattern"; then
              echo "Git credential configuration must be absent before repository code runs: $scope" >&2
              exit 1
            fi
          done
          for name in GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS GIT_SSH GIT_SSH_COMMAND GIT_CONFIG_COUNT; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "Credential environment must be absent before repository code runs: $name" >&2
              exit 1
            fi
          done
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: ${{ matrix.check-latest }}
      - name: Verify selected toolchain
        run: |
          go version
          go env GOTOOLCHAIN
      - name: Install Linux sandbox dependencies
        run: ./scripts/install-bubblewrap-ci.sh
      - run: go mod download
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...

  examples:
    name: Examples
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify checkout credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(http\..*\.extraheader|credential\..*|core\.askpass|url\..*\.insteadof)$'
          for scope in --local --global; do
            if git config "$scope" --name-only --get-regexp "$pattern"; then
              echo "Git credential configuration must be absent before repository code runs: $scope" >&2
              exit 1
            fi
          done
          for name in GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS GIT_SSH GIT_SSH_COMMAND GIT_CONFIG_COUNT; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "Credential environment must be absent before repository code runs: $name" >&2
              exit 1
            fi
          done
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.12'
          check-latest: false
      - name: Normalize checkout line endings (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Windows runner 全局 autocrlf=true 会把文本文件检出为 CRLF，导致 gofmt/tidy/
          # 合同测试假失败。先关闭 local autocrlf（git status 按原始字节对比，工作树
          # LF 不再被误判为改动），再把文本文件归一化为 LF。
          git config core.autocrlf false
          Get-ChildItem -Recurse -File | Where-Object {
            $_.Extension -in @('.go', '.mod', '.sum', '.txt', '.yml', '.yaml', '.md', '.sh', '.json')
          } | ForEach-Object {
            $content = [System.IO.File]::ReadAllText($_.FullName)
            if ($content.Contains("`r`n")) {
              $content = $content.Replace("`r`n", "`n")
              [System.IO.File]::WriteAllText($_.FullName, $content)
            }
          }
      - name: Verify examples module metadata
        shell: bash
        working-directory: examples
        run: GOWORK=off go mod tidy -diff
      - name: Verify examples module
        shell: bash
        run: ./scripts/verify-examples.sh
      - name: Verify repository remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Example verification generated untracked repository files." >&2
            git status --short
            exit 1
          fi

