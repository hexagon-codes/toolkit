name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 禁止 go 命令绕过矩阵静默下载其他工具链，确保每个门禁验证的就是声明版本。
  GOTOOLCHAIN: local

jobs:
  workflow-lint:
    name: Workflow lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify checkout credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(http\..*\.extraheader|credential\..*|core\.askpass|url\..*\.insteadof)$'
          for scope in --local --global; do
            if git config "$scope" --name-only --get-regexp "$pattern"; then
              echo "Git credential configuration must be absent before repository code runs: $scope" >&2
              exit 1
            fi
          done
          for name in GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS GIT_SSH GIT_SSH_COMMAND GIT_CONFIG_COUNT; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "Credential environment must be absent before repository code runs: $name" >&2
              exit 1
            fi
          done
      - name: Verify workflow credential contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          checkout = re.compile(r"^\s*(?:-\s*)?uses:\s*actions/checkout@[0-9a-f]{40}(?:\s|#|$)")
          persist_false = re.compile(r"^\s*persist-credentials:\s*(?:false|['\"]false['\"])\s*(?:#.*)?$")
          action = re.compile(r"^\s*(?:-\s*)?uses:\s*[^\s@]+@([0-9a-f]{40})(?:\s|#|$)")
          violations = []

          workflow_dir = Path(".github/workflows")
          workflow_paths = [*workflow_dir.glob("*.yml"), *workflow_dir.glob("*.yaml")]
          for path in sorted(workflow_paths):
              lines = path.read_text(encoding="utf-8").splitlines()
              for index, line in enumerate(lines):
                  uses_match = re.match(r"^\s*(?:-\s*)?uses:\s*([^\s#]+)", line)
                  if uses_match and not uses_match.group(1).startswith("./") and not action.search(line):
                      violations.append(f"{path}:{index + 1}: action must use a 40-character commit SHA")
                  if not checkout.search(line):
                      continue
                  indent = len(line) - len(line.lstrip())
                  block = []
                  for following in lines[index + 1:]:
                      following_indent = len(following) - len(following.lstrip())
                      if following.strip() and following_indent <= indent and following.lstrip().startswith("-"):
                          break
                      block.append(following)
                  if not any(persist_false.match(candidate) for candidate in block):
                      violations.append(f"{path}:{index + 1}: checkout must set persist-credentials: false")
                  next_step_index = index + len(block) + 1
                  if next_step_index >= len(lines):
                      violations.append(f"{path}:{index + 1}: checkout must be followed by credential verification")
                      continue
                  next_step = lines[next_step_index].strip().lower()
                  next_block = []
                  for candidate in lines[next_step_index:]:
                      candidate_indent = len(candidate) - len(candidate.lstrip())
                      if next_block and candidate.strip() and candidate_indent <= indent and candidate.lstrip().startswith("-"):
                          break
                      next_block.append(candidate)
                  if any(checkout.match(candidate) for candidate in next_block):
                      continue
                  if "credential" not in next_step or ("verify" not in next_step and "clean state" not in next_step):
                      violations.append(f"{path}:{index + 1}: first post-checkout step must verify credential cleanup")

          if violations:
              raise SystemExit("\n".join(violations))
          PY
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.12'
          check-latest: false
      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  test:
    name: Native minimum (${{ matrix.name }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04 托管运行器目前禁用了 bubblewrap/unshare 所需的命名空间能力，
          # Linux 沙箱测试固定在已验证可用的镜像上。
          - name: Linux
            os: ubuntu-22.04
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify checkout credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(http\..*\.extraheader|credential\..*|core\.askpass|url\..*\.insteadof)$'
          for scope in --local --global; do
            if git config "$scope" --name-only --get-regexp "$pattern"; then
              echo "Git credential configuration must be absent before repository code runs: $scope" >&2
              exit 1
            fi
          done
          for name in GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS GIT_SSH GIT_SSH_COMMAND GIT_CONFIG_COUNT; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "Credential environment must be absent before repository code runs: $name" >&2
              exit 1
            fi
          done
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # 该矩阵专门验证 go.mod 声明的最低版本，必须精确固定为 1.25.12。
          go-version: '1.25.12'
          check-latest: false
      - name: Normalize checkout line endings (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Windows runner 全局 autocrlf=true 会把文本文件检出为 CRLF，导致 gofmt/tidy/
          # 合同测试假失败。先关闭 local autocrlf（git status 按原始字节对比，工作树
          # LF 不再被误判为改动），再把文本文件归一化为 LF。
          git config core.autocrlf false
          Get-ChildItem -Recurse -File | Where-Object {
            $_.Extension -in @('.go', '.mod', '.sum', '.txt', '.yml', '.yaml', '.md', '.sh', '.json')
          } | ForEach-Object {
            $content = [System.IO.File]::ReadAllText($_.FullName)
            if ($content.Contains("`r`n")) {
              $content = $content.Replace("`r`n", "`n")
              [System.IO.File]::WriteAllText($_.FullName, $content)
            }
          }
      - name: Install Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: ./scripts/install-bubblewrap-ci.sh
      - name: Install Node.js 22 (macOS image node is broken)
        if: runner.os == 'macOS'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install working runtimes (macOS image node/pip are broken)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # 镜像自带 pip3 缺失 pip 模块，且 homebrew 为 externally-managed 环境；
          # PYTHONBREAKSYSTEMPACKAGES=1 绕过 PEP 668，用 ensurepip 重建完整 pip 包
          # 与脚本（--ignore-installed 只会装脚本不装包，导致 ModuleNotFoundError）。
          if PYTHONBREAKSYSTEMPACKAGES=1 python3 -m ensurepip --upgrade >/dev/null 2>&1; then
            :
          else
            curl -fsSL -o "$RUNNER_TEMP/get-pip.py" https://bootstrap.pypa.io/get-pip.py
            PYTHONBREAKSYSTEMPACKAGES=1 python3 "$RUNNER_TEMP/get-pip.py" --break-system-packages
          fi
          node --version
          pip3 --version
      - name: Verify root module metadata
        run: go mod tidy -diff
      - run: go mod download
      - name: Build
        run: go build -mod=readonly ./...
      - name: Vet
        run: go vet -mod=readonly ./...
      - name: Test
        run: go test -mod=readonly -count=1 ./...
      - name: Verify native macOS sandbox security
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(go env GOOS)" != "darwin" ]]; then
            echo "Expected a native macOS runner." >&2
            exit 1
          fi
          if ! go version | grep -Fq 'go1.25.12'; then
            echo "Expected Go 1.25.12 for the minimum-version security gate." >&2
            exit 1
          fi

          required_tests=(
            TestDarwinNoChildProfileOmitsProcessForkGrant
            TestDarwinNoChildCapabilitiesAreEnforced
            TestDarwinNoChildBoundaryAllowsDirectSingleProcessRuntimes
            TestDarwinNoChildBoundaryBlocksNativeForkVariants
            TestDarwinNoChildBoundaryBlocksLanguageRuntimeSpawns
            TestDarwinNoChildBoundaryAllowsNodeWorkerThreads
            TestDarwinNoChildBoundaryTimeoutAndCancelKillTrackedRoot
            TestDarwinNoChildBoundaryBlocksDelayedSetsidMarkerForOneHundredRuns
            TestDarwinNoChildEnvironmentLauncherStartsInsideSeatbelt
            TestDarwinResourceLauncherDoesNotLoadCallerInitWithPayloadEnvironment
            TestDarwinExecutionGuardRejectsWorkspaceHardlinkBeforePayload
            TestDarwinExecutionGuardRejectsWorkspacePathAndDirectoryReplacement
            TestDarwinTrustedBuildProfileAllowsChildrenWithoutClaimingContainment
            TestDarwinTrustedBuildRunsFrozenGoCompilerChild
            TestDarwinRejectsProcessCreationAndContainmentBeforePayload
          )
          alternation="$(IFS='|'; echo "${required_tests[*]}")"
          pattern="^(${alternation})$"
          listed_tests="$(go test ./os/sandbox -list "$pattern")"
          for test_name in "${required_tests[@]}"; do
            if ! grep -Fxq "$test_name" <<<"$listed_tests"; then
              echo "Required native macOS sandbox test is missing: $test_name" >&2
              exit 1
            fi
          done

          events="$RUNNER_TEMP/macos-sandbox-security.jsonl"
          set +e
          go test -json -count=1 -timeout 600s ./os/sandbox -run "$pattern" | tee "$events"
          test_exit_code=${PIPESTATUS[0]}
          set -e
          if [[ $test_exit_code -ne 0 ]]; then
            exit "$test_exit_code"
          fi
          for test_name in "${required_tests[@]}"; do
            if grep -Eq "\"Action\":\"skip\".*\"Test\":\"${test_name}(/[^\"]*)?\"" "$events"; then
              echo "Required native macOS sandbox test must not be skipped: $test_name" >&2
              exit 1
            fi
            if ! grep -Eq "\"Action\":\"pass\".*\"Test\":\"${test_name}\"([,}])" "$events"; then
              echo "Required native macOS sandbox test has no top-level pass event: $test_name" >&2
              exit 1
            fi
          done
      - name: Test (race + coverage)
        if: runner.os != 'Windows'
        run: go test -mod=readonly -race -count=1 -coverprofile=coverage.out ./...
      - name: Test Windows (race)
        if: runner.os == 'Windows'
        run: go test -mod=readonly -race -count=1 ./...
      - name: Verify repository remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "Go verification generated untracked repository files." >&2
            git status --short
            exit 1
          fi

  windows-sandbox-security:
    name: Native Windows sandbox security
    if: github.event_name != 'schedule'
    # GitHub 托管的 windows-2022 每个任务使用全新管理员 VM；策略仅存在于该任务生命周期内。
    # 运行时仍须证明 AppLocker 模块、AppIDSvc 和本地强制策略均真实可用，禁止按镜像标签推断能力。
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify hosted runner and checkout credentials
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          if ($env:RUNNER_ENVIRONMENT -ne "github-hosted") {
            throw "The Windows security gate must run on a GitHub-hosted runner."
          }
          if ($env:RUNNER_OS -ne "Windows" -or $env:RUNNER_ARCH -ne "X64") {
            throw "The Windows security gate requires a native Windows x64 runner."
          }
          $operatingSystem = Get-CimInstance -ClassName Win32_OperatingSystem -ErrorAction Stop
          if ($operatingSystem.Caption -notmatch "Windows Server 2022") {
            throw "The Windows security gate requires Windows Server 2022: $($operatingSystem.Caption)"
          }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw "The GitHub-hosted Windows security runner must use an administrator account."
          }
          $credentialPattern = '^(http\..*\.extraheader|credential\..*|core\.askpass|url\..*\.insteadof)$'
          foreach ($scope in @("--local", "--global")) {
            $credentialKeys = @(git config $scope --name-only --get-regexp $credentialPattern 2>$null)
            $gitConfigExitCode = $LASTEXITCODE
            if ($gitConfigExitCode -ne 0 -and $gitConfigExitCode -ne 1) {
              throw "Git credential configuration query failed for scope ${scope}: exit code $gitConfigExitCode"
            }
            if ($credentialKeys.Count -ne 0) {
              throw "Git credential configuration must be absent before repository code runs: $scope"
            }
          }
          foreach ($name in @("GH_TOKEN", "GITHUB_TOKEN", "GIT_ASKPASS", "SSH_ASKPASS", "GIT_SSH", "GIT_SSH_COMMAND", "GIT_CONFIG_COUNT")) {
            if (Test-Path "Env:$name") {
              throw "Credential environment must be absent before repository code runs: $name"
            }
          }
          $global:LASTEXITCODE = 0
      - name: Normalize checkout line endings (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Windows runner 全局 autocrlf=true 会把文本文件检出为 CRLF，导致 gofmt/tidy/
          # 合同测试假失败。先关闭 local autocrlf（git status 按原始字节对比，工作树
          # LF 不再被误判为改动），再把文本文件归一化为 LF。
          git config core.autocrlf false
          Get-ChildItem -Recurse -File | Where-Object {
            $_.Extension -in @('.go', '.mod', '.sum', '.txt', '.yml', '.yaml', '.md', '.sh', '.json')
          } | ForEach-Object {
            $content = [System.IO.File]::ReadAllText($_.FullName)
            if ($content.Contains("`r`n")) {
              $content = $content.Replace("`r`n", "`n")
              [System.IO.File]::WriteAllText($_.FullName, $content)
            }
          }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.12'
          check-latest: false
          cache: false
      - name: Prepare deterministic AppLocker fixtures
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          if ((go env GOOS) -ne "windows") {
            throw "Expected a native Windows runner."
          }
          if ((go version) -notmatch "go1\.25\.12") {
            throw "Expected Go 1.25.12 for the minimum-version security gate."
          }
          $appLockerModule = @(Get-Module -ListAvailable -Name AppLocker)
          if ($appLockerModule.Count -eq 0) {
            throw "The GitHub-hosted Windows runner must provide the AppLocker PowerShell module."
          }
          Import-Module AppLocker -ErrorAction Stop
          if (-not (Get-Command Get-AppLockerPolicy -ErrorAction SilentlyContinue) -or
              -not (Get-Command Set-AppLockerPolicy -ErrorAction SilentlyContinue) -or
              -not (Get-Command Test-AppLockerPolicy -ErrorAction SilentlyContinue)) {
            throw "The GitHub-hosted Windows runner must provide all required AppLocker cmdlets."
          }

          $fixtureRoot = Join-Path $env:RUNNER_TEMP "toolkit-windows-policy"
          New-Item -ItemType Directory -Path $fixtureRoot -Force | Out-Null
          $blockedExe = Join-Path $fixtureRoot "toolkit-policy-blocked.exe"
          $blockedScript = Join-Path $fixtureRoot "toolkit-policy-blocked.ps1"
          $allowedExe = Join-Path $fixtureRoot "toolkit-policy-allowed.exe"
          $allowedScript = Join-Path $fixtureRoot "toolkit-policy-allowed.ps1"
          Copy-Item -LiteralPath (Join-Path $env:SystemRoot "System32\whoami.exe") -Destination $blockedExe -Force
          Copy-Item -LiteralPath $blockedExe -Destination $allowedExe -Force
          Set-Content -LiteralPath $blockedScript -Encoding UTF8 -Value "Write-Output 'TOOLKIT_POLICY_EXECUTED'"
          Copy-Item -LiteralPath $blockedScript -Destination $allowedScript -Force

          & $blockedExe | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "The executable policy control fixture could not run before policy installation."
          }
          $scriptControl = & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $blockedScript
          if ($LASTEXITCODE -ne 0 -or $scriptControl -notcontains "TOOLKIT_POLICY_EXECUTED") {
            throw "The script policy control fixture could not run before policy installation."
          }

          $originalPolicy = Join-Path $env:RUNNER_TEMP "toolkit-applocker-original.xml"
          Get-AppLockerPolicy -Local -Xml | Set-Content -LiteralPath $originalPolicy -Encoding UTF8
          $service = Get-Service -Name AppIDSvc -ErrorAction Stop
          # AppIDSvc 是受保护服务，启动后无法可靠恢复原始停止态或 Manual 启动类型。
          # 本任务已在前置步骤强制证明使用一次性 GitHub 托管 VM，因此不伪造不可实现的服务回滚。
          & sc.exe config appidsvc "start=" "auto" | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "The GitHub-hosted Windows runner could not configure AppIDSvc for automatic startup."
          }
          if ($service.Status -ne [System.ServiceProcess.ServiceControllerStatus]::Running) {
            Start-Service -Name AppIDSvc -ErrorAction Stop
          }
          $service.WaitForStatus([System.ServiceProcess.ServiceControllerStatus]::Running, [TimeSpan]::FromSeconds(30))
          if ((Get-Service -Name AppIDSvc -ErrorAction Stop).Status -ne [System.ServiceProcess.ServiceControllerStatus]::Running) {
            throw "AppIDSvc did not reach the running state."
          }

          $policyPath = Join-Path $env:RUNNER_TEMP "toolkit-applocker-test.xml"
          $policyXml = @'
          <AppLockerPolicy Version="1">
            <RuleCollection Type="Exe" EnforcementMode="Enabled">
              <FilePathRule Id="{GUID_RULE_EXE_DENY}" Name="Deny Toolkit executable fixture" Description="" UserOrGroupSid="S-1-1-0" Action="Deny">
                <Conditions><FilePathCondition Path="*\toolkit-policy-blocked.exe" /></Conditions>
              </FilePathRule>
              <FilePathRule Id="{GUID_RULE_EXE_ALLOW}" Name="Allow other executables" Description="" UserOrGroupSid="S-1-1-0" Action="Allow">
                <Conditions><FilePathCondition Path="*" /></Conditions>
              </FilePathRule>
            </RuleCollection>
            <RuleCollection Type="Script" EnforcementMode="Enabled">
              <FilePathRule Id="{GUID_RULE_SCRIPT_DENY}" Name="Deny Toolkit script fixture" Description="" UserOrGroupSid="S-1-1-0" Action="Deny">
                <Conditions><FilePathCondition Path="*\toolkit-policy-blocked.ps1" /></Conditions>
              </FilePathRule>
              <FilePathRule Id="{GUID_RULE_SCRIPT_ALLOW}" Name="Allow other scripts" Description="" UserOrGroupSid="S-1-1-0" Action="Allow">
                <Conditions><FilePathCondition Path="*" /></Conditions>
              </FilePathRule>
            </RuleCollection>
            <RuleCollection Type="Dll" EnforcementMode="NotConfigured" />
            <RuleCollection Type="Msi" EnforcementMode="NotConfigured" />
            <RuleCollection Type="Appx" EnforcementMode="NotConfigured" />
          </AppLockerPolicy>
          '@
          # AppLocker 的 GuidType 只接受无花括号的标准 GUID；占位符在运行时生成，
          # 避免硬编码 GUID 触发 XML schema pattern 校验失败。
          $policyXml = $policyXml.Replace('{GUID_RULE_EXE_DENY}', [guid]::NewGuid().ToString())
          $policyXml = $policyXml.Replace('{GUID_RULE_EXE_ALLOW}', [guid]::NewGuid().ToString())
          $policyXml = $policyXml.Replace('{GUID_RULE_SCRIPT_DENY}', [guid]::NewGuid().ToString())
          $policyXml = $policyXml.Replace('{GUID_RULE_SCRIPT_ALLOW}', [guid]::NewGuid().ToString())
          Set-Content -LiteralPath $policyPath -Encoding UTF8 -Value $policyXml
          Set-AppLockerPolicy -XmlPolicy $policyPath

          foreach ($path in @($blockedExe, $blockedScript)) {
            $decision = (Get-AppLockerPolicy -Effective | Test-AppLockerPolicy -Path $path -User "Everyone").PolicyDecision
            if ([string]$decision -ne "Denied") {
              throw "The effective AppLocker policy did not deny the fixture: $path decision=$decision"
            }
          }

          $executableWasDenied = $false
          try {
            & $blockedExe | Out-Null
            $executableWasDenied = $LASTEXITCODE -ne 0
          } catch {
            $executableWasDenied = $true
          }
          if (-not $executableWasDenied) {
            throw "The executable AppLocker fixture was not blocked."
          }
          $scriptOutput = & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $blockedScript 2>&1
          if ($LASTEXITCODE -eq 0 -and $scriptOutput -contains "TOOLKIT_POLICY_EXECUTED") {
            throw "The script AppLocker fixture was not blocked."
          }
          & $allowedExe | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "The executable AppLocker allow control was blocked."
          }
          $allowedScriptOutput = & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $allowedScript
          if ($LASTEXITCODE -ne 0 -or $allowedScriptOutput -notcontains "TOOLKIT_POLICY_EXECUTED") {
            throw "The script AppLocker allow control was blocked."
          }

          "TOOLKIT_WINDOWS_POLICY_BLOCKED_EXE=$blockedExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TOOLKIT_WINDOWS_POLICY_BLOCKED_SCRIPT=$blockedScript" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and vet native Windows sandbox
        shell: pwsh
        run: |
          go mod download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -tags windows_security ./os/sandbox
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native Windows sandbox security
        shell: pwsh
        run: |
          $requiredTests = @(
            "TestWindows_SandboxCreation"
            "TestWindows_ExecSimpleCommand"
            "TestWindows_WorkspaceIsolation"
            "TestWindows_HostPathEscapeDenied"
            "TestWindowsWorkspaceRejectsRootJunction"
            "TestWindowsWorkspaceRootGuardRejectsJunction"
            "TestWindowsWorkspaceRejectsExternalHardLink"
            "TestWindowsWorkspaceRejectsReparsePoint"
            "TestWindowsWorkspaceRejectsInternalReparsePoint"
            "TestWindowsRestrictedTokenKeepsApplicationControlEnabled"
            "TestWindowsApplicationControlPolicyIsNotBypassed"
            "TestWindowsNetworkPolicyMatrix"
            "TestWindowsNetworkHostRejectedBeforeExecution"
            "TestWindows_NetworkDisabledSocketMatrix"
            "TestWindows_Timeout"
            "TestWindows_TimeoutTerminatesProcessContainment"
            "TestWindows_ContextCanceledTerminatesProcessContainment"
            "TestWindows_JobTotalMemoryEnforced"
            "TestWindows_JobProcessLimitEnforced"
            "TestWindows_ExecPreservesNonZeroExitCode"
            "TestWindowsLaunchFailureTransfersOwnershipToQuarantine"
            "TestWindowsProcessQuarantineRetriesBoundedlyAndPreservesErrors"
            "TestWindowsProcessQuarantineRetainsUnconfirmedResources"
            "TestWindowsSandboxCloseRetriesAndReclaimsQuarantinedLaunch"
            "TestWindowsSandboxCloseKeepsWorkspaceProtectedUntilRetriedReclaim"
            "TestWindowsNativePostCreationFaultOwnership"
            "TestWindowsNativePostCreationFaultCloseRetriesQuarantine"
            "TestWindowsNativeRetainExecutionOwnership"
          )
          if ($requiredTests.Count -ne 28) {
            throw "The native Windows security gate must contain exactly 28 required tests."
          }
          $pattern = "^(" + ($requiredTests -join "|") + ")$"
          $listedTests = @(go test -tags windows_security ./os/sandbox -list $pattern)
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          foreach ($test in $requiredTests) {
            if ($listedTests -notcontains $test) {
              throw "Required native Windows sandbox test is missing: $test"
            }
          }

          $events = @(go test -race -tags windows_security -json -count=1 -timeout 300s ./os/sandbox -run $pattern)
          $testExitCode = $LASTEXITCODE
          $events | ForEach-Object { Write-Output $_ }
          if ($testExitCode -ne 0) {
            exit $testExitCode
          }
          $parsedEvents = @($events | ForEach-Object {
            if (-not [string]::IsNullOrWhiteSpace($_)) {
              $_ | ConvertFrom-Json -ErrorAction Stop
            }
          })
          foreach ($requiredTest in $requiredTests) {
            $passEvents = @($parsedEvents | Where-Object { $_.Action -eq "pass" -and $_.Test -eq $requiredTest })
            if ($passEvents.Count -ne 1) {
              throw "Required native Windows sandbox test did not produce exactly one pass event: $requiredTest"
            }
            $skipEvents = @($parsedEvents | Where-Object {
              $_.Action -eq "skip" -and ($_.Test -eq $requiredTest -or $_.Test.StartsWith("$requiredTest/"))
            })
            if ($skipEvents.Count -ne 0) {
              throw "Required native Windows sandbox test was skipped: $requiredTest"
            }
          }
      - name: Restore local AppLocker policy
        if: always()
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $originalPolicy = Join-Path $env:RUNNER_TEMP "toolkit-applocker-original.xml"
          if (Test-Path -LiteralPath $originalPolicy) {
            Import-Module AppLocker -ErrorAction Stop
            Set-AppLockerPolicy -XmlPolicy $originalPolicy -ErrorAction Stop
          }

  linux-root-sandbox-security:
    name: Native root Linux sandbox security
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify checkout credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(http\..*\.extraheader|credential\..*|core\.askpass|url\..*\.insteadof)$'
          for scope in --local --global; do
            if git config "$scope" --name-only --get-regexp "$pattern"; then
              echo "Git credential configuration must be absent before repository code runs: $scope" >&2
              exit 1
            fi
          done
          for name in GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS GIT_SSH GIT_SSH_COMMAND GIT_CONFIG_COUNT; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "Credential environment must be absent before repository code runs: $name" >&2
              exit 1
            fi
          done
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.12'
          cache: false
      - name: Install native Linux sandbox dependencies
        run: ./scripts/install-bubblewrap-ci.sh
      - name: Probe root bubblewrap availability
        shell: bash
        run: |
          set -euo pipefail
          # GitHub 托管 runner 的 root 环境可能无法创建用户命名空间（bwrap 探测
          # 在 root 上下文失败而非 root 可用）；root 门禁仅在环境支持时强制执行。
          trusted_path="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          if sudo env -i HOME="$RUNNER_TEMP/toolkit-root-home" PATH="$trusted_path" \
            /usr/bin/bwrap --unshare-user --unshare-pid --unshare-ipc --unshare-uts \
            --cap-drop ALL --uid 65534 --gid 65534 --proc /proc --dev /dev -- /bin/true >/dev/null 2>&1; then
            echo "BWRAP_ROOT_USABLE=1" >> "$GITHUB_ENV"
          else
            echo "BWRAP_ROOT_USABLE=0" >> "$GITHUB_ENV"
            echo "root bubblewrap is unavailable on this runner; skipping root isolation gate"
          fi
      - name: Prepare isolated root and non-root test environments
        if: env.BWRAP_ROOT_USABLE == '1'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(go env GOOS)" != "linux" ]]; then
            echo "Expected a native Linux runner." >&2
            exit 1
          fi
          if ! go version | grep -Fq 'go1.25.12'; then
            echo "Expected Go 1.25.12 for the minimum-version security gate." >&2
            exit 1
          fi

          module_cache="$RUNNER_TEMP/toolkit-sandbox-modcache"
          GOMODCACHE="$module_cache" go mod download all
          chmod -R a+rX "$module_cache"

          sudo install -d -m 0700 "$RUNNER_TEMP/toolkit-root-home" "$RUNNER_TEMP/toolkit-root-cache" "$RUNNER_TEMP/toolkit-root-tmp"
          sudo install -d -o nobody -g "$(id -gn nobody)" -m 0700 \
            "$RUNNER_TEMP/toolkit-nonroot-home" \
            "$RUNNER_TEMP/toolkit-nonroot-cache" \
            "$RUNNER_TEMP/toolkit-nonroot-tmp"
      - name: Verify native root and non-root Linux sandbox security
        if: env.BWRAP_ROOT_USABLE == '1'
        shell: bash
        run: |
          set -euo pipefail
          go_bin="$(command -v go)"
          go_root="$(go env GOROOT)"
          module_cache="$RUNNER_TEMP/toolkit-sandbox-modcache"
          trusted_path="$go_root/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

          root_tests=(
            TestLinuxBoundaryProbeRootDropsCapabilitiesButRejectsIneffectiveProcessLimit
            TestLinuxRootExecReportsProcessesNotRequestedWithoutFalseEnforcement
            TestLinuxRootRequiredProcessesRejectsBeforePayload
            TestLinuxBwrapArgsDropCapabilitiesAndIsolateNamespaces
            TestLinuxMissingDeniedPathRejectsPayloadBeforeLaunch
            TestLinuxDeniedPathCreatedAfterNewRemainsHiddenAndReadOnly
            TestLinuxDeniedDirectoryCannotBeReadOrWritten
            TestLinuxWorkspaceRejectsHardlinkToExternalFile
            TestLinuxPreLaunchIdentityRecheckRejectsDirectoryReplacement
            TestLinuxPreLaunchIdentityRecheckRejectsCommandReplacement
            TestLinuxPreLaunchAuditRejectsNewExternalHardlink
            TestLinuxProcessContainmentTerminationIsBackedByPIDNamespace
            TestLinuxRootBwrapHidesHostUnixSocket
          )
          nonroot_tests=(
            TestLinuxBoundaryProbeNonRootProvesProcessLimitWithEAGAIN
            TestLinuxNonRootExecSeparatesAvailableProcessesCapabilityFromRequest
            TestLinuxNonRootConfiguredProcessLimitReachesEAGAIN
            TestLinuxBwrapHidesExternalWorkspaceWithoutPrivilege
          )
          required_tests=("${root_tests[@]}" "${nonroot_tests[@]}")
          alternation="$(IFS='|'; echo "${required_tests[*]}")"
          pattern="^(${alternation})$"
          listed_tests="$(go test ./os/sandbox -list "$pattern")"
          for test_name in "${required_tests[@]}"; do
            if ! grep -Fxq "$test_name" <<<"$listed_tests"; then
              echo "Required native Linux sandbox test is missing: $test_name" >&2
              exit 1
            fi
          done

          root_alternation="$(IFS='|'; echo "${root_tests[*]}")"
          root_pattern="^(${root_alternation})$"
          root_events="$RUNNER_TEMP/linux-root-sandbox-security.jsonl"
          if [[ "$(sudo id -u)" != "0" ]]; then
            echo "Expected an isolated root execution context." >&2
            exit 1
          fi
          if [[ "$(sudo env -i PATH="$trusted_path" GOROOT="$go_root" GOTOOLCHAIN=local "$go_bin" env GOOS)" != "linux" ]]; then
            echo "Expected a native Linux root execution context." >&2
            exit 1
          fi
          set +e
          sudo env -i \
            HOME="$RUNNER_TEMP/toolkit-root-home" \
            TMPDIR="$RUNNER_TEMP/toolkit-root-tmp" \
            PATH="$trusted_path" \
            GOROOT="$go_root" \
            GOTOOLCHAIN=local \
            GOWORK=off \
            GOENV=off \
            GOPATH="$RUNNER_TEMP/toolkit-root-home/go" \
            GOCACHE="$RUNNER_TEMP/toolkit-root-cache" \
            GOMODCACHE="$module_cache" \
            GOPROXY=off \
            GOSUMDB=off \
            "$go_bin" test -json -count=1 -timeout 600s ./os/sandbox -run "$root_pattern" | tee "$root_events"
          root_exit_code=${PIPESTATUS[0]}
          set -e
          if [[ $root_exit_code -ne 0 ]]; then
            exit "$root_exit_code"
          fi

          nonroot_alternation="$(IFS='|'; echo "${nonroot_tests[*]}")"
          nonroot_pattern="^(${nonroot_alternation})$"
          nonroot_events="$RUNNER_TEMP/linux-nonroot-sandbox-security.jsonl"
          if [[ "$(sudo -u nobody id -u)" == "0" ]]; then
            echo "Expected an isolated non-root execution context." >&2
            exit 1
          fi
          if [[ "$(sudo -u nobody env -i PATH="$trusted_path" GOROOT="$go_root" GOTOOLCHAIN=local "$go_bin" env GOOS)" != "linux" ]]; then
            echo "Expected a native Linux non-root execution context." >&2
            exit 1
          fi
          set +e
          sudo -u nobody env -i \
            HOME="$RUNNER_TEMP/toolkit-nonroot-home" \
            TMPDIR="$RUNNER_TEMP/toolkit-nonroot-tmp" \
            PATH="$trusted_path" \
            GOROOT="$go_root" \
            GOTOOLCHAIN=local \
            GOWORK=off \
            GOENV=off \
            GOPATH="$RUNNER_TEMP/toolkit-nonroot-home/go" \
            GOCACHE="$RUNNER_TEMP/toolkit-nonroot-cache" \
            GOMODCACHE="$module_cache" \
            GOPROXY=off \
            GOSUMDB=off \
            "$go_bin" test -json -count=1 -timeout 600s ./os/sandbox -run "$nonroot_pattern" | tee "$nonroot_events"
          nonroot_exit_code=${PIPESTATUS[0]}
          set -e
          if [[ $nonroot_exit_code -ne 0 ]]; then
            exit "$nonroot_exit_code"
          fi

          for test_name in "${root_tests[@]}"; do
            if grep -Eq "\"Action\":\"skip\".*\"Test\":\"${test_name}(/[^\"]*)?\"" "$root_events"; then
              echo "Required native root Linux sandbox test must not be skipped: $test_name" >&2
              exit 1
            fi
            if ! grep -Eq "\"Action\":\"pass\".*\"Test\":\"${test_name}\"([,}])" "$root_events"; then
              echo "Required native root Linux sandbox test has no top-level pass event: $test_name" >&2
              exit 1
            fi
          done
          for test_name in "${nonroot_tests[@]}"; do
            if grep -Eq "\"Action\":\"skip\".*\"Test\":\"${test_name}(/[^\"]*)?\"" "$nonroot_events"; then
              echo "Required native non-root Linux sandbox test must not be skipped: $test_name" >&2
              exit 1
            fi
            if ! grep -Eq "\"Action\":\"pass\".*\"Test\":\"${test_name}\"([,}])" "$nonroot_events"; then
              echo "Required native non-root Linux sandbox test has no top-level pass event: $test_name" >&2
              exit 1
            fi
          done

  toolchain-compatibility:
