name: Sandbox CodeExec

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - ".github/workflows/sandbox-code-exec.yml"
      - "scripts/install-bubblewrap-ci.sh"
      - "go.mod"
      - "go.sum"
      - "os/sandbox/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sandbox-code-exec.yml"
      - "scripts/install-bubblewrap-ci.sh"
      - "go.mod"
      - "go.sum"
      - "os/sandbox/**"
  workflow_dispatch:
    inputs:
      hexclaw_ref:
        description: "hexagon-codes/hexclaw ref to test against"
        required: false
        default: "main"
      run_live_network:
        description: "Run live network code_exec crawler checks on Linux/macOS"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: sandbox-code-exec-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.hexclaw_ref || 'main' }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.12"
  # 确保原生沙箱门禁使用 setup-go 选定的工具链，不允许静默自动升级。
  GOTOOLCHAIN: local
  GOPRIVATE: github.com/hexagon-codes/*
  HEXCLAW_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.hexclaw_ref || 'main' }}
  RUN_LIVE_NETWORK: ${{ github.event_name != 'workflow_dispatch' || inputs.run_live_network == 'true' }}

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify checkout credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(http\..*\.extraheader|credential\..*|core\.askpass|url\..*\.insteadof)$'
          for scope in --local --global; do
            if git config "$scope" --name-only --get-regexp "$pattern"; then
              echo "Git credential configuration must be absent before repository code runs: $scope" >&2
              exit 1
            fi
          done
          for name in GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS GIT_SSH GIT_SSH_COMMAND GIT_CONFIG_COUNT; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "Credential environment must be absent before repository code runs: $name" >&2
              exit 1
            fi
          done


      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  sandbox-code-exec:
    name: ${{ matrix.name }}
    needs: workflow-lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux sandbox/code_exec
            os: ubuntu-22.04
            live_network: "1"
          - name: macOS sandbox/code_exec
            os: macos-14
            live_network: "1"
          - name: Windows sandbox/code_exec
            os: windows-2022
            live_network: "0"

    steps:
      - name: Checkout toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: toolkit
          persist-credentials: false

      - name: Checkout ai-core
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: hexagon-codes/ai-core
          ref: main
          path: ai-core
          persist-credentials: false

      - name: Checkout hexagon
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: hexagon-codes/hexagon
          ref: main
          path: hexagon
          persist-credentials: false

      - name: Checkout hexclaw
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: hexagon-codes/hexclaw
          ref: ${{ env.HEXCLAW_REF }}
          path: hexclaw
          persist-credentials: false

      - name: Remove checkout credentials and verify clean state
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(http\..*\.extraheader|credential\..*|core\.askpass|url\..*\.insteadof)$'

          remove_git_auth_config() {
            label="$1"
            shift
            set +e
            keys="$(git "$@" --name-only --get-regexp "$pattern" 2>/dev/null)"
            query_exit=$?
            set -e
            if [[ $query_exit -ne 0 && $query_exit -ne 1 ]]; then
              echo "Failed to inspect Git credential configuration: $label" >&2
              return 1
            fi
            if [[ -n "$keys" ]]; then
              while IFS= read -r key; do
                git "$@" --unset-all "$key"
              done <<<"$keys"
            fi

            set +e
            remaining="$(git "$@" --name-only --get-regexp "$pattern" 2>/dev/null)"
            verify_exit=$?
            set -e
            if [[ $verify_exit -eq 0 || -n "$remaining" ]]; then
              echo "Git credential configuration remains after cleanup: $label" >&2
              return 1
            fi
            if [[ $verify_exit -ne 1 ]]; then
              echo "Failed to verify Git credential cleanup: $label" >&2
              return 1
            fi
          }

          remove_git_auth_config toolkit -C toolkit config --local
          remove_git_auth_config ai-core -C ai-core config --local
          remove_git_auth_config hexagon -C hexagon config --local
          remove_git_auth_config hexclaw -C hexclaw config --local

          if git config --global --name-only --get-regexp "$pattern"; then
            echo "Global Git credential configuration must be absent before repository code runs." >&2
            exit 1
          fi

          for name in GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS GIT_SSH GIT_SSH_COMMAND GIT_CONFIG_COUNT; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "Credential environment remains after cleanup: $name" >&2
              exit 1
            fi
          done

      - name: Normalize checkout line endings (Windows)
        if: runner.os == 'Windows'
        working-directory: toolkit
        shell: bash
        run: |
          # Windows runner 全局 autocrlf=true 会把文本文件检出为 CRLF，导致 gofmt/tidy/
          # 合同测试假失败。关闭 local autocrlf 后由 git 原生重写全部工作树文件为 LF
          # （checkout-index 不经 MSYS2 文本转换，二进制判定交给 git 自身）。
          git config core.autocrlf false
          git checkout-index -f -a
          echo "autocrlf=$(git config --get core.autocrlf) global=$(git config --global --get core.autocrlf)" 
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache-dependency-path: |
            toolkit/go.sum
            hexclaw/go.sum

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: ./toolkit/scripts/install-bubblewrap-ci.sh

      - name: Probe Linux sandbox backend
        if: runner.os == 'Linux'
        run: |
          bwrap --version
          unshare --version

      - name: Create Go workspace
        run: go work init ./toolkit ./ai-core ./hexagon ./hexclaw

      - name: Verify toolchain
        run: |
          go version
          python --version
          node --version
          go env GOPATH GOMODCACHE GOCACHE

      - name: Test toolkit sandbox
        working-directory: toolkit
        run: go test -v -count=1 -timeout 240s ./os/sandbox

      - name: Test platform code_exec contract
        working-directory: hexclaw
        shell: bash
        env:
          HEXCLAW_P0_SANDBOX_PROOF: "1"
          HEXCLAW_CODE_EXEC_LIVE_NETWORK: ${{ matrix.live_network == '1' && env.RUN_LIVE_NETWORK == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail

          common_tests=(
            TestCodeExecSkill_Meta
            TestCodeExecSkill_ToolDefinitionP0Fields
            TestDetectMissingPackages
            TestBuildInstallCommand
            TestSandboxP0_StaticGapMatrix
          )
          required_tests=("${common_tests[@]}")

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "Windows code_exec runtime integration is unavailable; enforcing the supported static contract."
          else
            required_tests+=(
              TestCodeExecSkill_Execute_Success
              TestCodeExecSkill_Execute_NonZeroExit
              TestCodeExecSkill_Execute_ModuleGoFiles
              TestCodeExecSkill_Execute_Timeout
            )
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              required_tests+=(TestBug20260626_CodeExecReadsConnectorAuthorizedDir)
            fi
            if [[ "$HEXCLAW_CODE_EXEC_LIVE_NETWORK" == "1" ]]; then
              required_tests+=(TestCodeExecSkill_Execute_PythonCrawlerNetworkPolicy)
            fi
          fi

          alternation="$(IFS='|'; echo "${required_tests[*]}")"
          pattern="^(${alternation})$"
          listed_tests="$(go test -list "$pattern" ./skill/builtin)"
          for test_name in "${required_tests[@]}"; do
            if ! grep -Fxq "$test_name" <<<"$listed_tests"; then
              echo "Required code_exec test is missing: $test_name" >&2
              exit 1
            fi
          done

          events="$RUNNER_TEMP/hexclaw-code-exec-${RUNNER_OS}.jsonl"
          set +e
          go test -json -count=1 -timeout 360s ./skill/builtin -run "$pattern" | tee "$events"
          test_exit_code=${PIPESTATUS[0]}
          set -e
          if [[ $test_exit_code -ne 0 ]]; then
            exit "$test_exit_code"
          fi

          for test_name in "${required_tests[@]}"; do
            if grep -Eq "\"Action\":\"skip\".*\"Test\":\"${test_name}(/[^\"]*)?\"" "$events"; then
              echo "Required code_exec test must not be skipped: $test_name" >&2
              exit 1
            fi
            if [[ "$(grep -Ec "\"Action\":\"pass\".*\"Test\":\"${test_name}\"([,}])" "$events")" -ne 1 ]]; then
              echo "Required code_exec test must produce exactly one top-level pass event: $test_name" >&2
              exit 1
            fi
          done
