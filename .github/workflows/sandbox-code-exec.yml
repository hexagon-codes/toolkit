name: Sandbox CodeExec

on:
  workflow_dispatch:
    inputs:
      hexclaw_ref:
        description: "hexagon-codes/hexclaw ref to test against"
        required: false
        default: ""
      run_live_network:
        description: "Run live network code_exec crawler checks on Linux/macOS"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: sandbox-code-exec-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.hexclaw_ref || 'main' }}
  cancel-in-progress: true

env:
  # 确保原生沙箱门禁使用 setup-go 选定的工具链，不允许静默自动升级。
  GOTOOLCHAIN: local
  GOPRIVATE: github.com/hexagon-codes/*
  RUN_LIVE_NETWORK: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_network == 'true' }}

jobs:
  workflow-lint:
    name: CodeExec workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify checkout credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(http\..*\.extraheader|credential\..*|core\.askpass|url\..*\.insteadof)$'
          for scope in --local --global; do
            if git config "$scope" --name-only --get-regexp "$pattern"; then
              echo "Git credential configuration must be absent before repository code runs: $scope" >&2
              exit 1
            fi
          done
          for name in GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS GIT_SSH GIT_SSH_COMMAND GIT_CONFIG_COUNT; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "Credential environment must be absent before repository code runs: $name" >&2
              exit 1
            fi
          done


      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Run actionlint
        env:
          GOWORK: "off"
        run: bash scripts/check-workflows.sh

  sandbox-code-exec:
    name: ${{ matrix.name }}
    needs: workflow-lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux sandbox/code_exec
            os: ubuntu-22.04
            live_network: "1"
          - name: macOS sandbox/code_exec
            os: macos-15
            live_network: "1"
          - name: Windows sandbox/code_exec
            os: windows-2022
            live_network: "0"

    steps:
      - name: Checkout toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: toolkit
          persist-credentials: false

      - name: Read consumer baselines
        id: consumers
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, os
          with open('toolkit/.github/consumer-baselines.json') as source:
              refs = json.load(source)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, sha in refs.items():
                  output.write(name.replace('-', '_') + '=' + sha + '\n')
          PYCODE
      - name: Checkout ai-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hexagon-codes/ai-core
          ref: ${{ steps.consumers.outputs.ai_core }}
          path: ai-core
          persist-credentials: false

      - name: Checkout hexagon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hexagon-codes/hexagon
          ref: ${{ steps.consumers.outputs.hexagon }}
          path: hexagon
          persist-credentials: false

      - name: Checkout hexclaw
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hexagon-codes/hexclaw
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.hexclaw_ref || steps.consumers.outputs.hexclaw }}
          path: hexclaw
          persist-credentials: false

      - name: Remove checkout credentials and verify clean state
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(http\..*\.extraheader|credential\..*|core\.askpass|url\..*\.insteadof)$'

          remove_git_auth_config() {
            label="$1"
            shift
            set +e
            keys="$(git "$@" --name-only --get-regexp "$pattern" 2>/dev/null)"
            query_exit=$?
            set -e
            if [[ $query_exit -ne 0 && $query_exit -ne 1 ]]; then
              echo "Failed to inspect Git credential configuration: $label" >&2
              return 1
            fi
            if [[ -n "$keys" ]]; then
              while IFS= read -r key; do
                git "$@" --unset-all "$key"
              done <<<"$keys"
            fi

            set +e
            remaining="$(git "$@" --name-only --get-regexp "$pattern" 2>/dev/null)"
            verify_exit=$?
            set -e
            if [[ $verify_exit -eq 0 || -n "$remaining" ]]; then
              echo "Git credential configuration remains after cleanup: $label" >&2
              return 1
            fi
            if [[ $verify_exit -ne 1 ]]; then
              echo "Failed to verify Git credential cleanup: $label" >&2
              return 1
            fi
          }

          remove_git_auth_config toolkit -C toolkit config --local
          remove_git_auth_config ai-core -C ai-core config --local
          remove_git_auth_config hexagon -C hexagon config --local
          remove_git_auth_config hexclaw -C hexclaw config --local

          if git config --global --name-only --get-regexp "$pattern"; then
            echo "Global Git credential configuration must be absent before repository code runs." >&2
            exit 1
          fi

          for name in GH_TOKEN GITHUB_TOKEN GIT_ASKPASS SSH_ASKPASS GIT_SSH GIT_SSH_COMMAND GIT_CONFIG_COUNT; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "Credential environment remains after cleanup: $name" >&2
              exit 1
            fi
          done

      - name: Normalize checkout line endings (Windows)
        if: runner.os == 'Windows'
        working-directory: toolkit
        shell: bash
        run: |
          # Windows runner 全局 autocrlf=true 会把文本文件检出为 CRLF，导致 gofmt/tidy/
          # 合同测试假失败。关闭 local autocrlf 后由 git 原生重写全部工作树文件为 LF
          # （checkout-index 不经 MSYS2 文本转换，二进制判定交给 git 自身）。
          git config core.autocrlf false
          git checkout-index -f -u -a
          # 重写工作树后刷新索引 stat 缓存，避免 git status 按旧 stat 误报 M。
          git update-index --refresh >/dev/null 2>&1 || true
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: toolkit/go.mod
          check-latest: false
          cache-dependency-path: |
            toolkit/go.sum
            hexclaw/go.sum

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: ./toolkit/scripts/install-bubblewrap-ci.sh

      - name: Probe Linux sandbox backend
        if: runner.os == 'Linux'
        run: |
          bwrap --version
          unshare --version

      - name: Create Go workspace
        run: go work init ./toolkit ./ai-core ./hexagon ./hexclaw

      - name: Verify toolchain
        run: |
          go version
          python --version
          node --version
          go env GOPATH GOMODCACHE GOCACHE

      - name: Test toolkit sandbox
        working-directory: toolkit
        run: go test -v -count=1 -timeout 240s ./os/sandbox

      - name: Test platform code_exec contract
        working-directory: hexclaw
        shell: bash
        env:
          HEXCLAW_P0_SANDBOX_PROOF: "1"
          HEXCLAW_CODE_EXEC_LIVE_NETWORK: ${{ matrix.live_network == '1' && env.RUN_LIVE_NETWORK == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          python scripts/verify-code-exec.py --output "$RUNNER_TEMP/code-exec-result.json"
          python ../toolkit/scripts/verify-code-exec-result.py "$RUNNER_TEMP/code-exec-result.json" "$(go env GOOS)"
      - name: Record verification inputs
        working-directory: toolkit
        shell: bash
        run: python scripts/verification-inputs.py "$RUNNER_TEMP/verification-inputs.json" --consumers
      - name: Preserve verification inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-inputs-${{ github.run_attempt }}-${{ runner.os }}
          path: ${{ runner.temp }}/verification-inputs.json
          retention-days: 90
      - name: Preserve diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-exec-diagnostics-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/code-exec*
          retention-days: 7
